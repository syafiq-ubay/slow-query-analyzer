services:
  elastic-export:
    build:
      context: .
      dockerfile: Dockerfile
    image: slow-query-analyzer:latest
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - ./main.py:/app/main.py:ro
      - ./elastic_client.py:/app/elastic_client.py:ro
      - ./exporter.py:/app/exporter.py:ro
      - ./correlator.py:/app/correlator.py:ro
    command:
      - mysql
      - --start-time
      - ${START_TIME:-auto}
      - --end-time
      - ${END_TIME:-now}
      - --output
      - output/mysql_slow_queries.xlsx
